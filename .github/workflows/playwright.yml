
name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 30
    runs-on: [self-hosted, bc-qa]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check QA Website on Port 80
        shell: powershell
        run: |
         curl.exe -I --connect-timeout 15 --max-time 30 http://k8-qa-job-web.nextenti.ai/

      - name: Run Candidate Login Tests
        run: npx playwright test tests/candidate-login.spec.ts --project=chromium
        env:
          BASE_URL: https://k8-qa-job-web.nextenti.ai
          CANDIDATE_MOBILE: ${{ secrets.CANDIDATE_MOBILE }}
          CANDIDATE_PASSWORD: ${{ secrets.CANDIDATE_PASSWORD }}
          INVALID_LOGIN_MOBILE: ${{ secrets.INVALID_LOGIN_MOBILE }}
          INVALID_LOGIN_PASSWORD: ${{ secrets.INVALID_LOGIN_PASSWORD }}
          INVALID_LOGIN_ERROR_MESSAGE: ${{ secrets.INVALID_LOGIN_ERROR_MESSAGE }}

      - name: Upload Playwright Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            reports/html-report/
            reports/test-results/
          retention-days: 15
          if-no-files-found: ignore
